# =====================================================================
# Seata 分布式事务配置（dataId: mall-seata.yaml，group: MALL_GROUP）
# 仅 order（TM）与 stock（RM）两个服务加载
# =====================================================================
seata:
  enabled: true
  application-id: ${spring.application.name}
  # 事务分组，与 Seata Server 的 vgroupMapping 对应
  tx-service-group: mall_tx_group
  # 自动代理数据源，AT 模式依赖它生成 undo_log 并做二阶段提交
  enable-auto-data-source-proxy: true
  service:
    vgroup-mapping:
      mall_tx_group: default
  registry:
    type: nacos
    nacos:
      application: seata-server
      server-addr: 127.0.0.1:8848
      namespace: mall-dev
      group: SEATA_GROUP
      username: nacos
      password: nacos
  config:
    type: nacos
    nacos:
      server-addr: 127.0.0.1:8848
      namespace: mall-dev
      group: SEATA_GROUP
      # 显式指定服务端配置文件 dataId，避免不同小版本默认值不一致导致读不到事务分组
      data-id: seataServer.properties
      username: nacos
      password: nacos

spring:
  cloud:
    alibaba:
      seata:
        tx-service-group: mall_tx_group

# =====================================================================
# 微服务公共共享配置（dataId: mall-common.yaml，group: MALL_GROUP）
# 所有微服务通过 bootstrap.yml 的 shared-configs 加载本文件
# =====================================================================
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

  # 链路追踪：全量采样，Zipkin 收集端地址
  sleuth:
    sampler:
      probability: 1.0
    zipkin:
      base-url: http://127.0.0.1:9411
      discovery-client-enabled: false

  # Spring Boot Admin 客户端上报
  boot:
    admin:
      client:
        url: http://127.0.0.1:8090
        instance:
          service-base-url: http://127.0.0.1:${server.port}
          prefer-ip: true

  # Sentinel 控制台与规则数据源
  cloud:
    sentinel:
      transport:
        dashboard: 127.0.0.1:8858
        port: 8719
      eager: true
      datasource:
        # 流控规则
        flow:
          nacos:
            server-addr: 127.0.0.1:8848
            namespace: mall-dev
            group-id: MALL_GROUP
            data-id: mall-sentinel-flow.json
            rule-type: flow
        # 熔断降级规则
        degrade:
          nacos:
            server-addr: 127.0.0.1:8848
            namespace: mall-dev
            group-id: MALL_GROUP
            data-id: mall-sentinel-degrade.json
            rule-type: degrade
        # 热点参数规则
        param-flow:
          nacos:
            server-addr: 127.0.0.1:8848
            namespace: mall-dev
            group-id: MALL_GROUP
            data-id: mall-sentinel-param.json
            rule-type: param-flow

# Feign：开启 Sentinel 降级、统一超时与日志级别
feign:
  sentinel:
    enabled: true
  client:
    config:
      default:
        connect-timeout: 5000
        read-timeout: 10000
        logger-level: full

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  type-aliases-package: com.mall
  mapper-locations: classpath*:/mapper/**/*.xml

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: info
    com.mall: debug
    org.springframework.cloud.openfeign: debug
    io.seata: info
